components:
  securitySchemes:
    dashboardSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from login. Send X-Tenant-Id when the user belongs to several
        organizations.
    secretKey:
      type: http
      scheme: bearer
      description: Secret API key `sk_...`. Server-side only.
    clientToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: End-user token from POST /tokens, signed with the tenant secret.
    refreshCookie:
      type: apiKey
      in: cookie
      name: syncra_refresh
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - VALIDATION_FAILED
                - PAYLOAD_TOO_LARGE
                - RATE_LIMITED
                - QUOTA_EXCEEDED
                - UNAVAILABLE
                - INTERNAL
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            requestId:
              type: string
