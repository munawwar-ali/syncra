  /sync/{c}/{id}/pull:
    post:
      summary: "HTTP fallback: fetch what the client lacks"
      description: Use when WebSockets are blocked. Same access checks and limits as the WebSocket.
      tags:
        - HTTP sync fallback
      operationId: post_sync_c_id_pull
      parameters:
        - name: c
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stateVector:
                  type: string
                  maxLength: 2000000
                  pattern: ^[A-Za-z0-9_-]*$
              required:
                - stateVector
              additionalProperties: false
      security: &a5
        - clientToken: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sync/{c}/{id}/push:
    post:
      summary: "HTTP fallback: send an update"
      description: Idempotent on (clientId, opId).
      tags:
        - HTTP sync fallback
      operationId: post_sync_c_id_push
      parameters:
        - name: c
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: string
                  minLength: 1
                  maxLength: 128
                opId:
                  type: string
                  minLength: 1
                  maxLength: 200
                update:
                  type: string
                  maxLength: 2000000
                  pattern: ^[A-Za-z0-9_-]*$
              required:
                - clientId
                - opId
                - update
              additionalProperties: false
      security: *a5
      responses:
        "200":
