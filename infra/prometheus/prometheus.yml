global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Every replica of the `server` service: Docker's DNS returns one A record per container, so
  # `docker compose up --scale server=3` is picked up within a refresh interval.
  - job_name: syncra-server
    metrics_path: /metrics
    # The password is METRICS_TOKEN. Prometheus does not expand environment variables in its config,
    # so the compose service writes the value to this file at start-up. When METRICS_TOKEN is unset
    # the server does not ask for credentials and the empty password is ignored.
    basic_auth:
      username: prometheus
      password_file: /tmp/metrics_token
    dns_sd_configs:
      - names: [server]
        type: A
        port: 8080
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
      - source_labels: [__address__]
        target_label: instance

  - job_name: syncra-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
        refresh_interval: 10s
