worker_processes auto;
events { worker_connections 20000; }

http {
  # Tokens travel in the query string of the WebSocket URL; never write them to the access log.
  map $request_uri $safe_uri { ~^(?<p>[^?]*)\?.*token=[^&]* "$p?[query redacted]"; default $request_uri; }
  log_format syncra '$remote_addr [$time_local] "$request_method $safe_uri" $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log syncra;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Docker's embedded DNS answers with every replica of `server`; re-resolving every 5 s lets
  # `docker compose up --scale server=3` (and rolling restarts) take effect without reloading nginx.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 80;
    server_tokens off;
    set $sync_nodes http://server:8080;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /v1/connect {
      proxy_pass $sync_nodes;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      proxy_buffering off;
    }

    location /v1/changes/stream {
      proxy_pass $sync_nodes;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 1h;
    }

    location /v1/ {
      proxy_pass $sync_nodes;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-Id $request_id;
      client_max_body_size 1m;
    }

    location /v1/monitor/stream {
      proxy_pass $sync_nodes;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 1h;
    }

    location /demo/ { proxy_pass $sync_nodes; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /readyz { proxy_pass $sync_nodes; }
    location /metrics { deny all; }   # scraped inside the compose network, never through the edge

    # Static apps (built in Phase 5/6) are mounted under /usr/share/nginx/html.
    location /notes/ { alias /usr/share/nginx/html/demo-notes/; try_files $uri /notes/index.html; }
    location /inspection/ { alias /usr/share/nginx/html/demo-inspection/; try_files $uri /inspection/index.html; }
    location / { root /usr/share/nginx/html/dashboard; try_files $uri /index.html; }
  }
}
