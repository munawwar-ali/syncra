name: syncra

x-pg: &pg
  image: postgres:16-alpine
  command: ['postgres', '-c', 'synchronous_commit=on']
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -U syncra -d $$POSTGRES_DB']
    interval: 3s
    timeout: 3s
    retries: 20

# Shared by server, worker and migrate. The defaults make `docker compose up` work on a fresh clone;
# they are development values. Set real ones in .env before exposing the stack (docs/self-hosting.md).
x-app-env: &app-env
  NODE_ENV: production
  CONTROL_DATABASE_URL: postgres://syncra:${POSTGRES_PASSWORD:-syncra_dev_password}@pg-control:5432/syncra_control
  SHARD_DATABASE_URLS: postgres://syncra:${POSTGRES_PASSWORD:-syncra_dev_password}@pg-shard-0:5432/syncra_shard_0,postgres://syncra:${POSTGRES_PASSWORD:-syncra_dev_password}@pg-shard-1:5432/syncra_shard_1
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me-0123456789}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktMzItYnl0ZXM=}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  BILLING_ENABLED: ${BILLING_ENABLED:-false}
  WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}

services:
  pg-control:
    <<: *pg
    environment:
      POSTGRES_USER: syncra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncra_dev_password}
      POSTGRES_DB: syncra_control
    volumes: [pgdata-control:/var/lib/postgresql/data]

  pg-shard-0:
    <<: *pg
    environment:
      POSTGRES_USER: syncra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncra_dev_password}
      POSTGRES_DB: syncra_shard_0
    volumes: [pgdata-shard0:/var/lib/postgresql/data]

  pg-shard-1:
    <<: *pg
    environment:
      POSTGRES_USER: syncra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncra_dev_password}
      POSTGRES_DB: syncra_shard_1
    volumes: [pgdata-shard1:/var/lib/postgresql/data]

  redis:
    image: redis:7.2-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: migrations on the control DB and both shards, then the demo tenant (credentials printed to its log).
  migrate:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.migrate }
    restart: 'no'
    environment:
      <<: *app-env
      SEED_DEMO_TENANT: ${SEED_DEMO_TENANT:-true}
      CREDENTIALS_FILE: /credentials/.syncra-demo-credentials.txt
    volumes: [../../.syncra:/credentials]
    depends_on:
      pg-control: { condition: service_healthy }
      pg-shard-0: { condition: service_healthy }
      pg-shard-1: { condition: service_healthy }

  # Scale with: docker compose up --scale server=3
  server:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.server }
    environment:
      <<: *app-env
      PORT: '8080'
      TRUST_PROXY: 'true'
      DEMO_MODE: ${DEMO_MODE:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    stop_grace_period: 20s # SIGTERM -> close 1001 -> flush batched writes -> exit
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.worker }
    environment:
      <<: *app-env
      WORKER_PORT: '9100'
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  nginx:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.web }
    ports: ['8080:80']
    depends_on:
      server: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.55.1
    # Prometheus does not expand env vars in its config, so the scrape password is written to a file first.
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'printf %s "$$METRICS_TOKEN" > /tmp/metrics_token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=7d',
      ]
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ['9090:9090']
    depends_on: [server]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Development convenience: a read-only anonymous viewer so the dashboard opens with no login.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/syncra.json
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3000:3000']
    depends_on: [prometheus]

  # Network chaos: docker compose --profile chaos up. Clients connect to :8666, which forwards to nginx.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    profiles: [chaos]
    ports: ['8474:8474', '8666:8666']
    depends_on: [nginx]

  # Load generator: docker compose --profile loadtest run --rm k6 run /scripts/ws-steady.js
  k6:
    image: grafana/k6:0.54.0
    profiles: [loadtest]
    entrypoint: ['k6']
    environment:
      SYNCRA_URL: ${SYNCRA_URL:-http://nginx}
      SYNCRA_SECRET_KEY: ${SYNCRA_SECRET_KEY:-}
    volumes:
      - ../../loadtest/k6:/scripts:ro
      - ../../loadtest/results:/results
    depends_on: [nginx]

volumes:
  pgdata-control:
  pgdata-shard0:
  pgdata-shard1:
  redisdata:
