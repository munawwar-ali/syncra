# Dev override: publishes datastore ports on localhost.
# Use: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.dev.yml up
services:
  pg-control:
    ports: ['5432:5432']
  pg-shard-0:
    ports: ['5433:5432']
  pg-shard-1:
    ports: ['5434:5432']
  redis:
    ports: ['6379:6379']
